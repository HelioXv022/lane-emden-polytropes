[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lane-emden-polytropes"
version = "0.1.0"
description = "Numerical exploration of Lane-Emden polytropes with an archived undergraduate research excerpt"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.11,<2", "matplotlib>=3.7,<4"]

[tool.setuptools.packages.find]
include = ["lane_emden*"]
